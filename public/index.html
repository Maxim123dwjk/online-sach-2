<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Šach</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: white; 
            margin: 0;
            padding: 15px;
        }
        h1 { font-size: 1.8em; margin: 10px 0 5px 0; }
        #status { 
            font-size: 1.2em; 
            margin: 10px 0; 
            font-weight: bold; 
            color: #00d2d3;
            min-height: 30px;
        }
        #board { 
            width: 90vw;
            max-width: 500px; 
            margin: 15px auto; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
        }

        /* Vzhľad šachovnice */
        .white-1e1d3 {
            background-color: #f0d9b5 !important;
            color: #b58863 !important;
        }
        .black-3c85d {
            background-color: #b58863 !important;
            color: #f0d9b5 !important;
        }

        .btn { 
            padding: 12px 20px; 
            font-size: 1em; 
            cursor: pointer; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            margin: 5px;
            font-weight: bold;
        }
        .btn:hover { background: #218838; }
        #restartBtn { background: #007bff; display: none; }
        #restartBtn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Online Šach</h1>
    <div id="status">Pripájanie k serveru...</div>
    <div id="board"></div>

    <div>
        <button class="btn" onclick="copyInviteLink()">Vytvoriť pozvánku pre kamaráta</button>
        <button class="btn" id="restartBtn" onclick="requestRestart()">Hrať znova (Play Again)</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let game = new Chess();
        let board = null;
        let myColor = null;

        // Vstavané SVG figúrky bez potreby sťahovania obrázkov
        const svgPieces = {
            'wP': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23fff" stroke="%23000" stroke-width="1.5"/></svg>',
            'wR': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23fff" stroke="%23000" stroke-width="1.5"><path d="M9 39h27v-3H9v3zM12 36h21l-1.5-4H13.5l-1.5 4zM11 14h23l-2 18H13l-2-18zM9 10h4v4H9v-4zM16 10h3v4h-3v-4zM22 10h3v4h-3v-4zM28 10h3v4h-3v-4zM32 10h4v4h-4v-4z"/></g></svg>',
            'wN': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path d="M 22 10 C 32.5 11 38.5 18 38 39 L 15 39 C 15 30 13.5 21.5 6 17 C 6.5 13 10 11 11.5 13.5 C 12 16 11 18.5 11 18.5 C 11 18.5 17 15.5 17 8.5 C 19.5 8.5 21.5 9.5 22 10 z" fill="%23fff" stroke="%23000" stroke-width="1.5"/></svg>',
            'wB': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23fff" stroke="%23000" stroke-width="1.5"><path d="M9 36c1.24-2.59 6-5.23 6-8.5 0-2.07-1.41-3.6-2.5-4.5 1.5-.5 3-2 3-4 0-2.21-1.79-4-4-4 1.5 0 2.5-1.5 2.5-2.5C14 11.01 12.5 9 10.5 9 8.5 9 7 11.01 7 12.5c0 1 1 2.5 2.5 2.5-2.21 0-4 1.79-4 4 0 2 1.5 3.5 3 4-1.09.9-2.5 2.43-2.5 4.5 0 3.27 4.76 5.91 6 8.5z" transform="translate(12,0)"/></g></svg>',
            'wQ': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23fff" stroke="%23000" stroke-width="1.5"><path d="M8 36h29v-3H8v3zM11 33h23l-2-5H13l-2 5zM9 26h27l2-15-7 6-8.5-11L14 17l-7-6 2 15z"/><circle cx="6" cy="11" r="2"/><circle cx="14" cy="17" r="2"/><circle cx="22.5" cy="9" r="2"/><circle cx="31" cy="17" r="2"/><circle cx="39" cy="11" r="2"/></g></svg>',
            'wK': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23fff" stroke="%23000" stroke-width="1.5"><path d="M22.5 11.63V6M20 8h5M22.5 25c-4 0-7-2.5-7-7 0-4 3-7 7-7s7 3 7 7c0 4.5-3 7-7 7zM11.5 37h22v-3h-22v3zM14.5 34h16l-2-5h-12l-2 5z"/></g></svg>',
            
            'bP': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="%23000" stroke="%23fff" stroke-width="1.5"/></svg>',
            'bR': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23000" stroke="%23fff" stroke-width="1.5"><path d="M9 39h27v-3H9v3zM12 36h21l-1.5-4H13.5l-1.5 4zM11 14h23l-2 18H13l-2-18zM9 10h4v4H9v-4zM16 10h3v4h-3v-4zM22 10h3v4h-3v-4zM28 10h3v4h-3v-4zM32 10h4v4h-4v-4z"/></g></svg>',
            'bN': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><path d="M 22 10 C 32.5 11 38.5 18 38 39 L 15 39 C 15 30 13.5 21.5 6 17 C 6.5 13 10 11 11.5 13.5 C 12 16 11 18.5 11 18.5 C 11 18.5 17 15.5 17 8.5 C 19.5 8.5 21.5 9.5 22 10 z" fill="%23000" stroke="%23fff" stroke-width="1.5"/></svg>',
            'bB': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23000" stroke="%23fff" stroke-width="1.5"><path d="M9 36c1.24-2.59 6-5.23 6-8.5 0-2.07-1.41-3.6-2.5-4.5 1.5-.5 3-2 3-4 0-2.21-1.79-4-4-4 1.5 0 2.5-1.5 2.5-2.5C14 11.01 12.5 9 10.5 9 8.5 9 7 11.01 7 12.5c0 1 1 2.5 2.5 2.5-2.21 0-4 1.79-4 4 0 2 1.5 3.5 3 4-1.09.9-2.5 2.43-2.5 4.5 0 3.27 4.76 5.91 6 8.5z" transform="translate(12,0)"/></g></svg>',
            'bQ': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23000" stroke="%23fff" stroke-width="1.5"><path d="M8 36h29v-3H8v3zM11 33h23l-2-5H13l-2 5zM9 26h27l2-15-7 6-8.5-11L14 17l-7-6 2 15z"/><circle cx="6" cy="11" r="2"/><circle cx="14" cy="17" r="2"/><circle cx="22.5" cy="9" r="2"/><circle cx="31" cy="17" r="2"/><circle cx="39" cy="11" r="2"/></g></svg>',
            'bK': 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><g fill="%23000" stroke="%23fff" stroke-width="1.5"><path d="M22.5 11.63V6M20 8h5M22.5 25c-4 0-7-2.5-7-7 0-4 3-7 7-7s7 3 7 7c0 4.5-3 7-7 7zM11.5 37h22v-3h-22v3zM14.5 34h16l-2-5h-12l-2 5z"/></g></svg>'
        };

        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');

        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 9);
            window.history.pushState({}, '', '?room=' + roomId);
        }

        socket.emit('joinRoom', roomId);

        socket.on('init', (data) => {
            myColor = data.color;
            if (myColor === 'w') {
                document.getElementById('status').innerText = 'Si BIELY. Čaká sa na druhého hráča...';
            } else if (myColor === 'b') {
                document.getElementById('status').innerText = 'Si ČIERNY. Hra začína!';
            } else {
                document.getElementById('status').innerText = 'Miestnosť je plná (Si iba divák)';
            }
            initBoard();
        });

        socket.on('startGame', () => {
            if (myColor === 'w') {
                document.getElementById('status').innerText = 'Hráč sa pripojil! Si na ťahu (Biely).';
            }
        });

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && (myColor !== 'w' || piece.search(/^b/) !== -1)) ||
                (game.turn() === 'b' && (myColor !== 'b' || piece.search(/^w/) !== -1))) {
                return false;
            }
        }

        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            socket.emit('move', { source, target });
            updateStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        socket.on('move', (moveData) => {
            game.move({ from: moveData.source, to: moveData.target, promotion: 'q' });
            board.position(game.fen());
            updateStatus();
        });

        function initBoard() {
            const config = {
                draggable: true,
                position: 'start',
                orientation: myColor === 'b' ? 'black' : 'white',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: function(piece) {
                    return svgPieces[piece];
                }
            };
            board = Chessboard('board', config);
        }

        function updateStatus() {
            let status = '';
            const turnText = game.turn() === 'w' ? 'Biely' : 'Čierny';

            if (game.in_checkmate()) {
                status = `Koniec hry - Šach mat! Vyhral ${game.turn() === 'b' ? 'Biely' : 'Čierny'}.`;
                document.getElementById('restartBtn').style.display = 'inline-block';
            } else if (game.in_draw()) {
                status = 'Koniec hry - Remíza!';
                document.getElementById('restartBtn').style.display = 'inline-block';
            } else {
                status = `Na ťahu je: ${turnText}`;
                if (game.in_check()) {
                    status += ' (ŠACH!)';
                }
            }
            document.getElementById('status').innerText = status;
        }

        function requestRestart() {
            document.getElementById('status').innerText = 'Čaká sa na druhého hráča...';
            document.getElementById('restartBtn').disabled = true;
            socket.emit('restartGame');
        }

        socket.on('playerWantsRestart', () => {
            document.getElementById('status').innerText = 'Súper chce hrať znova! Klikni na Play Again.';
        });

        socket.on('resetBoard', () => {
            game.reset();
            board.start();
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('restartBtn').disabled = false;
            updateStatus();
        });

        function copyInviteLink() {
            const el = document.createElement('textarea');
            el.value = window.location.href;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('Odkaz bol skopírovaný!');
        }
    </script>
</body>
</html>
